name: 构建并发布

# ───────────────────────────────────────────────────────────────
# 触发方式
#
#   1. push tag          打 tag 推送 → 构建并发布 Release
#   2. push 分支         只构建校验，不发布
#   3. workflow_dispatch 手动指定 tag 补发 / 强制重发
#
# 注意：tags 用 '**' 而不是 'v*' —— 这是 glob 匹配，写 v* 的话 v 以外的 tag 一律漏掉。
# ───────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - '**'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag（留空 = 取仓库最新 tag）'
        required: false
        default: ''
      force:
        description: '强制重新发布（即使该 tag 已有 Release）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kimi-pet-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        # 千万别开 fetch-tags 选项 —— tag push 时 checkout 会用
        # +<sha>:refs/tags/<tag> 检出当前 tag，再加 --tags（即
        # refs/tags/*:refs/tags/*）会让两个 refspec 写同一个 destination，
        # git 直接 fatal: Cannot fetch both ... and refs/tags/<tag>
        # → 任务 exit 128。需要远端 tag 列表时用下一步的 git ls-remote。

      - name: 解析版本号
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=""; RELEASE="false"

          # checkout 只拉当前 ref，本地未必有全部 tag，直接查远端。
          # sort -V 是版本排序：v1.10 必须排在 v1.9 之后，字典序会排反。
          latest_tag() {
            git ls-remote --tags origin 2>/dev/null \
              | sed -n 's#.*refs/tags/##p' \
              | grep -v '\^' \
              | sort -V \
              | tail -1
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-$(latest_tag)}"
            if [ -z "$TAG" ]; then
              echo "::error::仓库里没有任何 tag，也没指定 tag，没法发布"
              exit 1
            fi
            RELEASE="true"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            RELEASE="true"
          else
            TAG="dev"
            RELEASE="false"
            echo "::warning::分支 push → 只构建校验，不发布。要发布请打 tag 再推送。"
          fi

          [ -z "$TAG" ] && TAG="dev"

          if [ "$RELEASE" = "true" ] && [ "$FORCE" != "true" ] && [ "$TAG" != "dev" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'KimiPet_x64.exe' \
                 && gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'KimiPet_x86.exe'; then
                echo "tag $TAG 的 Release 已存在且产物齐全 → 跳过"
                RELEASE="false"
              fi
            fi
          fi

          echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "==> tag=$TAG  should_release=$RELEASE"

      # 手动补发时 checkout 检的是默认分支 HEAD，可能已经前进了；
      # 显式切到目标 tag，保证编出来的 exe 和 Release 的 tag 对应。
      # 单个 refspec + --no-tags，不会和上面的 checkout 撞车。
      - name: 切到目标 tag 的代码
        if: steps.meta.outputs.tag != 'dev'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --force "refs/tags/$TAG"

      - name: 安装 mingw-w64 交叉编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          x86_64-w64-mingw32-gcc --version | head -1
          i686-w64-mingw32-gcc  --version | head -1

      - name: 编译 exe
        env:
          OUT: ${{ runner.temp }}/kimi-pet-exe
        run: |
          # 源码在 src/ 子目录下，build.sh 也在里面
          (cd src && sh build.sh)
          echo "EXE_DIR=${{ runner.temp }}/kimi-pet-exe" >> "$GITHUB_ENV"

      - name: 检查产物
        run: |
          ls -la "$EXE_DIR/"
          file "$EXE_DIR/KimiPet_x64.exe" "$EXE_DIR/KimiPet_x86.exe"
          test -s "$EXE_DIR/KimiPet_x64.exe" || { echo "64 位产物为空"; exit 1; }
          test -s "$EXE_DIR/KimiPet_x86.exe" || { echo "32 位产物为空"; exit 1; }

      - name: 整理产物
        run: |
          set -euo pipefail

          # 两个 exe 直接平铺，不再套一层 zip —— Release 区域里点开就是 exe。
          # 程序自带的「检查更新」也是按架构直接下载单个 exe 覆盖自己的。
          DIST="$GITHUB_WORKSPACE/dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          cp "$EXE_DIR/KimiPet_x64.exe" "$EXE_DIR/KimiPet_x86.exe" "$DIST/"

          # 独立手动更新器：给「能检测到新版本但下载不下来」的老版本用户
          # 手动跑一次用；也作为普通用户的备用升级手段。
          cp "$GITHUB_WORKSPACE/src/KimiPetUpdater.bat" "$DIST/"

          echo "--- Release 附件（平铺） ---"
          ls -la "$DIST"/*.exe "$DIST"/*.bat

          (cd "$DIST" && sha256sum *.exe) > "$DIST/SHA256SUMS.txt"
          echo "--- SHA256 ---"
          cat "$DIST/SHA256SUMS.txt"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: KimiPet-${{ steps.meta.outputs.tag }}
          path: |
            dist/*.exe
            dist/*.bat
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.bat
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 小结
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASED: ${{ steps.meta.outputs.should_release }}
        run: |
          echo "tag      : $TAG"
          echo "已发布   : $RELEASED"
          if [ "$RELEASED" != "true" ]; then
            echo "::notice::本次未发布。要发布：打 tag 推送，或 Actions → 本工作流 → Run workflow → 填 tag 名。"
          fi
