name: 构建并发布

# ───────────────────────────────────────────────────────────────
# 触发方式
#
#   1. push tag          打 tag 推送 → 构建并发布 Release
#   2. push 分支         只构建校验，不发布
#   3. workflow_dispatch 手动指定 tag 补发 / 强制重发
#
# 注意：tags 用 '**' 而不是 'v*' —— 这是 glob 匹配，写 v* 的话 v 以外的 tag 一律漏掉。
# ───────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - '**'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag（留空 = 取仓库最新 tag）'
        required: false
        default: ''
      force:
        description: '强制重新发布（即使该 tag 已有 Release）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kimi-pet-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: 解析版本号
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=""; RELEASE="false"

          latest_tag() { git tag -l --sort=-creatordate | head -1; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-$(latest_tag)}"
            RELEASE="true"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            RELEASE="true"
          else
            TAG="dev"
            RELEASE="false"
            echo "::warning::分支 push → 只构建校验，不发布。要发布请打 tag 再推送。"
          fi

          [ -z "$TAG" ] && TAG="dev"

          if [ "$RELEASE" = "true" ] && [ "$FORCE" != "true" ] && [ "$TAG" != "dev" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'KimiPet_x64.exe' \
                 && gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'KimiPet_x86.exe'; then
                echo "tag $TAG 的 Release 已存在且产物齐全 → 跳过"
                RELEASE="false"
              fi
            fi
          fi

          echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "should_release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "==> tag=$TAG  should_release=$RELEASE"

      - name: 安装 mingw-w64 交叉编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 zip
          x86_64-w64-mingw32-gcc --version | head -1
          i686-w64-mingw32-gcc  --version | head -1

      - name: 编译 exe
        env:
          OUT: ${{ runner.temp }}/kimi-pet-exe
        run: |
          # 源码在 src/ 子目录下，build.sh 也在里面
          (cd src && sh build.sh)
          echo "EXE_DIR=${{ runner.temp }}/kimi-pet-exe" >> "$GITHUB_ENV"

      - name: 检查产物
        run: |
          ls -la "$EXE_DIR/"
          file "$EXE_DIR/KimiPet_x64.exe" "$EXE_DIR/KimiPet_x86.exe"
          test -s "$EXE_DIR/KimiPet_x64.exe" || { echo "64 位产物为空"; exit 1; }
          test -s "$EXE_DIR/KimiPet_x86.exe" || { echo "32 位产物为空"; exit 1; }

      - name: 打包
        id: pkg
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/dist"
          NAME="KimiPet-${TAG}"

          rm -rf "$DIST"
          mkdir -p "$DIST/${NAME}"

          cp "$EXE_DIR/KimiPet_x64.exe" "$EXE_DIR/KimiPet_x86.exe" "$DIST/${NAME}/"

          cp "$EXE_DIR/KimiPet_x64.exe" "$EXE_DIR/KimiPet_x86.exe" "$DIST/"

          ZIP="$DIST/${NAME}.zip"
          rm -f "$ZIP"
          (cd "$DIST" && zip -qr "${NAME}.zip" "${NAME}")

          echo "--- 独立 exe（供自检更新下载） ---"
          ls -la "$DIST"/*.exe
          echo "--- zip 内容 ---"
          unzip -l "$ZIP"
          echo "--- 确认只有 exe ---"
          for f in README.md KimiPet.ico LICENSE 使用说明.txt; do
            test ! -e "$DIST/${NAME}/$f" || { echo "$f 不该出现在产物里"; exit 1; }
          done

          (cd "$DIST/${NAME}" && sha256sum *.exe) > "$DIST/SHA256SUMS.txt"
          echo "--- SHA256 ---"
          cat "$DIST/SHA256SUMS.txt"

          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: KimiPet-${{ steps.meta.outputs.tag }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 小结
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASED: ${{ steps.meta.outputs.should_release }}
        run: |
          echo "tag      : $TAG"
          echo "已发布   : $RELEASED"
          if [ "$RELEASED" != "true" ]; then
            echo "::notice::本次未发布。要发布：打 tag 推送，或 Actions → 本工作流 → Run workflow → 填 tag 名。"
          fi
